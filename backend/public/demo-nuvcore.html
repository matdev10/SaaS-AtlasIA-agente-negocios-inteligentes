<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vista previa del agente</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #07060b;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var fallbackWidget = "81fd9a2e-33a5-4982-8b53-855811d83198";
        var widget = params.get("widget") || fallbackWidget;
        if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(widget)) {
          widget = fallbackWidget;
        }

        var api = location.origin;
        var requested = params.get("api");
        if (requested) {
          try {
            var url = new URL(requested);
            if (
              (url.protocol === "http:" || url.protocol === "https:") &&
              !url.username &&
              !url.password
            ) {
              api = url.origin;
            }
          } catch (error) {
            api = location.origin;
          }
        }

        var open = params.get("open") === "1" ? ' data-atlasia-open="true"' : "";
        document.write(
          '<script src="' +
            api +
            "/widget.js?t=" +
            Date.now() +
            '" data-atlasia-widget="' +
            widget +
            '" data-atlasia-api="' +
            api +
            '"' +
            open +
            "></" +
            "script>"
        );
      })();
    </script>
  </body>
</html>
