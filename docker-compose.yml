services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: atlasia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlasia
    ports:
      - "5433:5432"
    volumes:
      - atlasia_postgres_data:/var/lib/postgresql/data

volumes:
  atlasia_postgres_data: